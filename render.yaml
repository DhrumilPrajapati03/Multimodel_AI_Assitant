# Render Blueprint for the free plan.
# Render dashboard -> New -> Blueprint -> pick this repo.
# The database is Neon (free, doesn't expire); Render's free Postgres is deleted after 30 days.
services:
  - type: web
    name: academy-assistant
    runtime: docker
    region: singapore          # closest Render region to India, and next to the Neon database
    plan: free                 # 512 MB RAM; sleeps after 15 min idle, ~1 min to wake
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false            # Render asks for these values when you create the Blueprint
      - key: DATABASE_URL
        sync: false            # your Neon connection string
      - key: ADMIN_TOKEN
        generateValue: true    # random password for /admin - copy it from the Environment tab
